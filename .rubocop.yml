plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "test/fixtures/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 150

Metrics/AbcSize:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Layout/LineLength:
  Max: 120

Minitest/MultipleAssertions:
  Max: 5

Naming/FileName:
  Exclude:
    - "lib/jekyll-privatus-analytics.rb"

Style/ClassAndModuleChildren:
  Exclude:
    - "test/**/*"
